appId: com.Baglib.app
productName: Baglib
npmRebuild: false
extraResources:
  # KEY-265: the merged Sunnah research database (about 1.56 GB raw), opened read-only from resources/sunnah.
  # The owners authorized bundling it; it is built locally by tools/hadith-alignment and never committed.
  - from: tools/hadith-alignment/data/output/sunnah_merged_quranlab_v1.sqlite
    to: sunnah/sunnah_merged_quranlab_v1.sqlite
  - from: assets/poetry
    to: poetry
    filter:
      - "**/*.py"
  - from: assets/pdf-editor
    to: pdf-editor
    filter:
      - "**/*"
      - "!**/__pycache__/**"
  - from: assets/native-share.ps1
    to: native-share.ps1
  - from: assets/ocr
    to: ocr
    filter:
      - "**/*.py"
      - "!**/__pycache__/**"
  # Engine tools come from scripts/setup-pdf-engine.ps1. Each one runs from any folder.
  - from: .baglib-data/pdf-engine/java/jdk-25.0.5+8-jre
    to: pdf-engine/java/jdk-25.0.5+8-jre
  - from: .baglib-data/pdf-engine/stirling
    to: pdf-engine/stirling
    filter:
      - Stirling-PDF-server.jar
  - from: .baglib-data/pdf-engine/verapdf
    to: pdf-engine/verapdf
  - from: .baglib-data/pdf-engine/poppler
    to: pdf-engine/poppler
  - from: .baglib-data/pdf-engine/ghostscript
    to: pdf-engine/ghostscript
    filter:
      - "**/*"
      - "!uninstgs.exe"
      - "!doc/**"
      - "!examples/**"
  - from: .baglib-data/pdf-engine/tesseract
    to: pdf-engine/tesseract
    filter:
      - "**/*"
      - "!tessdata/**"
      - "!doc/**"
      - "!*-training.exe"
      - "!*train*.exe"
      - "!winpath.exe"
      - "!tesseract-uninstall.exe"
  - from: .baglib-data/pdf-engine/ocr-best
    to: pdf-engine/ocr-best
  - from: .baglib-data/pdf-engine/tessdata
    to: pdf-engine/tessdata
  - from: .baglib-data/pdf-engine/weasyprint
    to: pdf-engine/weasyprint
  - from: .baglib-data/pdf-engine/python
    to: pdf-engine/python
directories:
  output: release
files:
  - dist/**/*
  - out/**/*
  - package.json
  - node_modules/better-sqlite3/**/*
  - node_modules/pdfjs-dist/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - node_modules/prebuild-install/**/*
asarUnpack:
  - "**/*.node"
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
win:
  icon: assets/installer/icon.ico
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  # Leaving perMachine unset is what shows the "only me or all users" page.
  allowElevation: true
  allowToChangeInstallationDirectory: true
  multiLanguageInstaller: true
  displayLanguageSelector: true
  installerLanguages:
    - en_US
    - ar_SA
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Baglib
  deleteAppDataOnUninstall: false
  include: assets/installer/installer.nsh
  # The Arabic for the template's install-mode page replaces its English, which NSIS reports as a warning.
  warningsAsErrors: false

protocols:
  - name: BagLib study links
    schemes:
      - baglib

fileAssociations:
  - ext: epub
    name: Electronic Publication
    description: EPUB E-Book
    role: Viewer
  - ext: pdf
    name: Portable Document Format
    description: PDF Document
    role: Viewer
  - ext: mobi
    name: Mobipocket E-Book
    description: MOBI E-Book
    role: Viewer
  - ext: azw3
    name: Kindle Format 8
    description: Amazon Kindle Book
    role: Viewer
  - ext: azw
    name: Amazon Kindle E-Book
    description: Amazon Kindle Book
    role: Viewer
  - ext: fb2
    name: FictionBook 2.0
    description: FB2 E-Book
    role: Viewer
  - ext: cbz
    name: Comic Book Zip
    description: Comic Book Archive
    role: Viewer
  - ext: cbr
    name: Comic Book RAR
    description: Comic Book Archive
    role: Viewer
  - ext: cbt
    name: Comic Book Tar
    description: Comic Book Archive
    role: Viewer
  - ext: cb7
    name: Comic Book 7z
    description: Comic Book Archive
    role: Viewer
  - ext: txt
    name: Plain Text Document
    description: Text Document
    role: Viewer
  - ext: md
    name: Markdown Document
    description: Markdown Document
    role: Viewer
  - ext: docx
    name: Microsoft Word Document
    description: Word Document
    role: Viewer
