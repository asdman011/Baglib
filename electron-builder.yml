appId: com.Baglib.app
productName: Baglib
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - out/**/*
  - package.json
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - node_modules/prebuild-install/**/*
asarUnpack:
  - "**/*.node"
mac:
  category: public.app-category.utilities

  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - zip
